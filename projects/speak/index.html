<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Speak Text: a simple, performant reader</title>
    <meta
      name="description"
      content="Select text on your Mac and run one Raycast command. A natural voice reads it at your speed, on your device."
    />
    <meta name="theme-color" content="#0F2624" />
    <link rel="icon" href="assets/icon.png" type="image/png" />
    <link rel="apple-touch-icon" href="assets/icon.png" />
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="player.js"></script>
  </head>
  <body>
    <main>
      <img class="mark rise" src="assets/icon.png" alt="" width="96" height="96" />
      <p class="name rise d1">Speak Text</p>
      <h1 class="rise d2">A simple, <span>performant reader.</span></h1>
      <p class="lede rise d3">
        Select text on your Mac and run one Raycast command. A natural voice
        reads it at your speed, on your device.
      </p>

      <section class="player rise d4" aria-label="Voice sample player">
        <div
          id="wave"
          class="wave"
          role="slider"
          tabindex="0"
          aria-label="Position"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
        >
          <canvas aria-hidden="true"></canvas>
        </div>
        <div class="controls">
          <div class="speed" role="group" aria-label="Speed">
            <button id="slower" type="button" aria-label="Slower">&minus;</button>
            <output id="rate" aria-live="polite">1×</output>
            <button id="faster" type="button" aria-label="Faster">+</button>
          </div>
          <button id="play" class="play" type="button" aria-label="Play">
            <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.2v13.6a1 1 0 0 0 1.5.86l11.3-6.8a1 1 0 0 0 0-1.72L9.5 4.34A1 1 0 0 0 8 5.2Z" /></svg>
            <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="4.5" width="4.4" height="15" rx="1.4" /><rect x="13.6" y="4.5" width="4.4" height="15" rx="1.4" /></svg>
            <span class="i-busy" aria-hidden="true"></span>
          </button>
          <p class="time"><span id="clock">0:00</span></p>
        </div>
        <textarea
          id="input"
          rows="3"
          maxlength="2500"
          aria-label="Text to read aloud"
          placeholder="Paste a passage to hear it read aloud."
          hidden
        ></textarea>
        <p id="message" class="message" role="status"></p>
        <button id="mode" class="link" type="button">Read your own text</button>
      </section>

      <a class="primary rise d5" href="assets/Speak-Text.rayext" download>Download for Raycast</a>
      <p class="note rise d5">
        Free. Needs Raycast on macOS 13 or later.
        <a href="https://github.com/rami-maalouf/raycast-extensions/tree/add-speak-highlighted-text/extensions/speak-highlighted-text">Source and setup</a>
      </p>
      <p class="keys rise d5" aria-label="Keyboard shortcuts">
        <span><kbd>Space</kbd> pause</span>
        <span><kbd>←</kbd><kbd>→</kbd> skip 5 s</span>
        <span><kbd>−</kbd><kbd>=</kbd> speed</span>
      </p>
    </main>
  </body>
</html>
